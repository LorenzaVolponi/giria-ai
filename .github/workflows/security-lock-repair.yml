name: Security Lock Repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/editorial-authority-seo-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Repair vulnerable lock resolutions
        run: npm audit fix --package-lock-only
      - name: Verify high severity audit is clean
        run: npm audit --audit-level=high
      - name: Commit repaired lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(security): atualizar lock para resolver vulnerabilidades high"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
