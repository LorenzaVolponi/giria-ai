name: Production endpoint diagnostic

on:
  push:
    branches:
      - perf/vercel-phase2-batch

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect production HTTP surfaces
        shell: bash
        run: |
          set +e
          BASE_URL="https://giria-ai.vercel.app"
          for path in "/" "/api/v1/health" "/health" "/robots.txt"; do
            echo "===== $path ====="
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$BASE_URL$path")"
            exit_code=$?
            echo "curl_exit=$exit_code http_code=$code"
            echo "--- headers ---"
            sed -n '1,40p' "$headers"
            echo "--- body (first 1000 bytes) ---"
            head -c 1000 "$body" || true
            echo
            rm -f "$headers" "$body"
          done
