name: Phase 2 validation

on:
  push:
    branches:
      - perf/vercel-phase2-batch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install current lock
        run: npm ci

      - name: Refresh Browserslist within existing dependency ranges
        run: npm update browserslist --package-lock-only --ignore-scripts

      - name: Reinstall refreshed lock
        run: npm ci

      - name: Security gate
        run: bash scripts/security-check.sh

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: phase2-package-lock
          path: package-lock.json
          retention-days: 1
