name: Phase 2 validation

on:
  push:
    branches:
      - perf/vercel-phase2-batch
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install current lock
        run: npm ci

      - name: Pin patched Browserslist and refresh npm lock
        run: |
          npm pkg set 'overrides.browserslist=^4.28.7'
          npm update browserslist --package-lock-only --ignore-scripts

      - name: Reinstall refreshed lock
        run: npm ci

      - name: Security gate
        run: bash scripts/security-check.sh

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Finalize npm-only dependency state
        run: |
          rm -f bun.lock
          rm -f .github/workflows/phase2-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A package.json package-lock.json bun.lock .github/workflows/phase2-validation.yml
          if git diff --cached --quiet; then
            echo 'No dependency state changes to commit.'
            exit 0
          fi
          git commit -m 'chore: pin patched browserslist and standardize npm lock'
          git push origin HEAD:perf/vercel-phase2-batch
