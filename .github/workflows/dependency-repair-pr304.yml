name: Repair dependencies on PR 304
on:
  push:
    branches:
      - fix/validation-feedback-login-20261103
    paths:
      - .github/workflows/dependency-repair-pr304.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Repair non-breaking dependency advisories
        run: npm audit fix
      - name: Check updated dependency tree
        run: npm audit --audit-level=high
      - name: Run test suite
        run: npm test
      - name: Verify production build
        run: npm run build
      - name: Commit repaired lockfile on PR branch
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "No dependency changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "fix(deps): resolve npm audit advisories and refresh lockfile"
          git push origin HEAD:fix/validation-feedback-login-20261103
