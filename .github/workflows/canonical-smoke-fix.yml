name: Canonical and smoke fix validation

on:
  push:
    branches:
      - fix/production-canonical-smoke

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Normalize canonical production domain
        shell: bash
        run: |
          set -euo pipefail
          old='https://giria-ai.vercel.app'
          new='https://giria-ai.volponi.tech'
          while IFS= read -r -d '' file; do
            sed -i "s#${old}#${new}#g" "$file"
          done < <(git grep -lz -- "$old" || true)

          sed -i 's/CURL_RETRY=(--retry/CURL_RETRY=(--location --retry/' scripts/post-deploy-smoke.sh
          sed -i 's/curl -fsS --connect-timeout/curl -fsS --location --connect-timeout/' scripts/post-deploy-smoke.sh

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Security gate
        run: bash scripts/security-check.sh

      - name: Finalize validated patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/canonical-smoke-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: use canonical production domain and follow redirects in smoke checks'
          git push origin HEAD:fix/production-canonical-smoke
