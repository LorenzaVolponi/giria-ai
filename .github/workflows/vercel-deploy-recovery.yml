name: Vercel deployment recovery

on:
  schedule:
    # Runs hourly. Rate-limit failures are held for their cooldown and then
    # retried at most once per 24h window, avoiding an hourly redeploy loop.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: read
  checks: read

concurrency:
  group: vercel-deployment-recovery
  cancel-in-progress: false

jobs:
  recover-production:
    name: Recover production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate recovery configuration
        id: config
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Vercel recovery inactive::Add the VERCEL_DEPLOY_HOOK_URL repository secret to enable automatic recovery."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Inspect latest main deployment status
        id: deployment
        if: steps.config.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: "main",
            });

            const sha = branch.data.commit.sha;
            core.setOutput("sha", sha);

            const combined = await github.rest.repos.getCombinedStatusForRef({
              owner,
              repo,
              ref: sha,
            });

            const vercelStatuses = combined.data.statuses
              .filter((status) => status.context.toLowerCase().includes("vercel"))
              .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

            if (vercelStatuses.length === 0) {
              core.notice(`No Vercel status found for ${sha}. Nothing will be retried.`);
              core.setOutput("retry", "false");
              core.setOutput("state", "missing");
              return;
            }

            const latest = vercelStatuses[0];
            const ageMinutes = Math.floor(
              (Date.now() - new Date(latest.updated_at).getTime()) / 60000,
            );
            const failed = latest.state === "failure" || latest.state === "error";
            const stale = latest.state === "pending" && ageMinutes >= 45;
            const description = String(latest.description || "").toLowerCase();
            const targetUrl = String(latest.target_url || "").toLowerCase();
            const rateLimited =
              /rate.?limit|too many deployments|retry in \d+ hours?/.test(description) ||
              targetUrl.includes("build-rate-limit") ||
              targetUrl.includes("upgradetopro=build-rate-limit");

            const hoursMatch = description.match(/retry in\s+(\d+)\s+hours?/);
            const cooldownMinutes = Math.max(60, Number(hoursMatch?.[1] || 24) * 60);
            const retryEveryMinutes = 24 * 60;
            const cooldownExpired = rateLimited && ageMinutes >= cooldownMinutes;
            const minutesAfterCooldown = Math.max(0, ageMinutes - cooldownMinutes);
            const inRateLimitRetryWindow =
              cooldownExpired && (minutesAfterCooldown % retryEveryMinutes) < 60;

            const shouldRetry = rateLimited
              ? failed && inRateLimitRetryWindow
              : failed || stale;

            core.info(
              `Latest Vercel status for ${sha}: ${latest.state} (${ageMinutes} minutes old).`,
            );

            if (rateLimited && !cooldownExpired) {
              core.notice(
                `Vercel is rate limited. Recovery suppressed until the ${cooldownMinutes}-minute cooldown expires.`,
              );
            } else if (rateLimited && inRateLimitRetryWindow) {
              core.notice(
                "Vercel rate-limit cooldown expired. One recovery deployment is allowed in this 24h retry window.",
              );
            } else if (rateLimited) {
              core.notice(
                "Vercel remains rate limited. Recovery is outside the single allowed 24h retry window and will stay suppressed.",
              );
            }

            core.setOutput("retry", String(shouldRetry));
            core.setOutput("state", latest.state);
            core.setOutput("rate_limited", String(rateLimited));
            core.setOutput("cooldown_expired", String(cooldownExpired));
            core.setOutput("age_minutes", String(ageMinutes));
            core.setOutput("cooldown_minutes", String(cooldownMinutes));
            core.setOutput("target_url", latest.target_url || "");

      - name: Trigger recovery deployment
        if: steps.deployment.outputs.retry == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set +e
          response_file="$(mktemp)"
          http_code="$(curl \
            --silent \
            --show-error \
            --location \
            --request POST \
            --max-time 30 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            "$VERCEL_DEPLOY_HOOK_URL")"
          curl_exit=$?
          response_body="$(cat "$response_file")"
          rm -f "$response_file"
          set -e

          if [ "$curl_exit" -ne 0 ]; then
            echo "::warning title=Vercel recovery unavailable::The deploy hook could not be reached. A later scheduled recovery window can retry."
            exit 0
          fi

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Vercel accepted the recovery deployment for commit ${{ steps.deployment.outputs.sha }}."
            exit 0
          fi

          case "$http_code" in
            402|409|423|429|503)
              echo "::warning title=Vercel recovery deferred::Vercel returned HTTP $http_code. The next attempt will wait for a later recovery window."
              ;;
            *)
              echo "Vercel response: $response_body"
              echo "::error title=Vercel recovery misconfigured::Deploy hook returned HTTP $http_code. Check whether the hook is valid and targets the main branch."
              exit 1
              ;;
          esac

      - name: Publish recovery summary
        if: always()
        run: |
          {
            echo "## Vercel deployment recovery"
            echo
            if [ "${{ steps.config.outputs.configured }}" != "true" ]; then
              echo "Recovery is installed but inactive because the repository secret is missing."
            elif [ "${{ steps.deployment.outputs.rate_limited }}" = "true" ] && [ "${{ steps.deployment.outputs.retry }}" != "true" ]; then
              echo "Recovery is intentionally suppressed while respecting the Vercel rate-limit cooldown/window."
              echo
              echo "Cooldown: \`${{ steps.deployment.outputs.cooldown_minutes }}\` minutes; status age: \`${{ steps.deployment.outputs.age_minutes }}\` minutes."
            elif [ "${{ steps.deployment.outputs.retry }}" = "true" ]; then
              echo "A recovery attempt was requested for \`${{ steps.deployment.outputs.sha }}\`."
              echo
              echo "Detected Vercel state: \`${{ steps.deployment.outputs.state }}\`."
            else
              echo "No recovery deployment was necessary."
              echo
              echo "Detected Vercel state: \`${{ steps.deployment.outputs.state }}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
