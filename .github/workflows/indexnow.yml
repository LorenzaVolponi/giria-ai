name: IndexNow Discovery

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Production Surface Smoke"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve production site
        id: site
        shell: bash
        run: |
          SITE_URL="${{ vars.PRODUCTION_BASE_URL }}"
          if [ -z "$SITE_URL" ]; then
            SITE_URL="https://giria-ai.vercel.app"
          fi
          SITE_URL="${SITE_URL%/}"
          echo "site_url=$SITE_URL" >> "$GITHUB_OUTPUT"

      - name: Validate submission script
        run: node --check scripts/indexnow-submit.mjs

      - name: Resolve deployed diff
        id: deployed
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          echo "before_sha=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dry-run changed URL detection
        if: github.event_name != 'workflow_run'
        env:
          SITE_URL: ${{ steps.site.outputs.site_url }}
          BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          INDEXNOW_DRY_RUN: "1"
          INDEXNOW_ALL_CORE: "1"
        run: node scripts/indexnow-submit.mjs

      - name: Wait until verification key is public
        if: github.event_name == 'workflow_run'
        env:
          SITE_URL: ${{ steps.site.outputs.site_url }}
          INDEXNOW_KEY: 7d9e3b6a2f414c88a5d791e6b4c2f3a8
        shell: bash
        run: |
          KEY_URL="$SITE_URL/$INDEXNOW_KEY.txt"
          BODY="$(curl -fsS --connect-timeout 10 --max-time 20 "$KEY_URL")"
          if [ "$BODY" != "$INDEXNOW_KEY" ]; then
            echo "IndexNow verification key is not public at $KEY_URL"
            exit 1
          fi
          echo "IndexNow verification key is public."

      - name: Submit meaningful changed URLs
        if: github.event_name == 'workflow_run'
        env:
          SITE_URL: ${{ steps.site.outputs.site_url }}
          BEFORE_SHA: ${{ steps.deployed.outputs.before_sha }}
          GITHUB_SHA: ${{ steps.deployed.outputs.head_sha }}
          INDEXNOW_KEY: 7d9e3b6a2f414c88a5d791e6b4c2f3a8
        run: node scripts/indexnow-submit.mjs
