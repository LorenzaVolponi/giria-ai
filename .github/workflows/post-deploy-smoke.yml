name: Post Deploy Smoke

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL do ambiente para smoke test"
        required: true
        default: "https://giria-ai.vercel.app"
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve target URL
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BASE_URL="${{ github.event.inputs.target_url }}"
          else
            BASE_URL="${{ vars.PRODUCTION_BASE_URL }}"
          fi

          if [ -z "$BASE_URL" ]; then
            BASE_URL="https://giria-ai.vercel.app"
          fi

          BASE_URL="${BASE_URL%/}"
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Validate target URL
        shell: bash
        run: |
          case "${{ steps.target.outputs.base_url }}" in
            https://*) ;;
            *) echo "Target URL deve usar HTTPS"; exit 1 ;;
          esac

      - name: Run production smoke
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: bash scripts/post-deploy-smoke.sh "$BASE_URL"
